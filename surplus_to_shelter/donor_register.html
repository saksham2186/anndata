<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donor Registration | AnnData</title><link rel="stylesheet" href="/site_shared.css"><style>body{background:#fff8ec;font-family:Poppins,Arial,sans-serif}.wrap{max-width:760px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}input{box-sizing:border-box;width:100%;padding:12px;border:2px solid #f0e6d4;border-radius:12px}label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}.btn{border:0;border-radius:99px;padding:12px 18px;background:#ff6b35;color:#fff;font-weight:700;cursor:pointer}.ok{color:#176b3a}.error{color:#b42318}.muted{color:#777}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><header style="padding:18px 24px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center"><div><h1 style="margin:0">🍱 Donor Registration</h1><small>Create your AnnData donor account</small></div><a href="/donor">← Donor website</a></header><div class="wrap"><div class="card"><h2>Donor Details</h2><p class="muted">No OTP or phone verification is required.</p><div class="row"><div><label>Full name</label><input id="name" autocomplete="name"></div><div><label>Email</label><input id="email" type="email" autocomplete="email"></div></div><label>Mobile number</label><input id="phone" placeholder="9876543210" inputmode="numeric" autocomplete="tel"><label>Password</label><input id="password" type="password" minlength="6" autocomplete="new-password"><button class="btn" style="margin-top:16px" onclick="register()">✅ Create Donor Account</button><p id="msg"></p></div></div><script>const $=id=>document.getElementById(id);async function register(){try{const name=$('name').value.trim(),email=$('email').value.trim(),phone=$('phone').value.trim(),password=$('password').value;if(!name||!email||!phone||!password)throw Error('Please fill all fields.');if(password.length<6)throw Error('Password must be at least 6 characters.');const r=await fetch('/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password,role:'donor',phone})});const j=await r.json();if(!r.ok)throw Error(j.detail||'Registration failed');localStorage.setItem('anndataDonorUser',JSON.stringify(j));$('msg').className='ok';$('msg').textContent='✅ Registration complete. Opening donor workspace…';setTimeout(()=>location.href='/donor',500)}catch(e){$('msg').className='error';$('msg').textContent='❌ '+e.message}}</script></body></html>
